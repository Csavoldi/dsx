[package]
name = "dsx-amd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "DeepSeek-V4.1-Flash-1017 inference on one AMD Instinct MI325X"
publish = false

[dependencies]
dsx-core = { path = "../core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
rayon = "1"
serde_json = "1"
tokenizers = "0.23"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
